<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>admin</title>
  <link rel="icon" href="cover/small-logo.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="/adm-style.css">
  <style>
    table { width: 100%; border-collapse: collapse; margin: 20px 0; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background-color: #f4f4f4; }
    h2 { color: #333; }
  </style>
</head>
<body>

  <div class="header-bar">
    <a href="/">Главная</a>
    <button class="open-btn msg-btn active" onclick="showBlock('msg')">Заявки клиентов</button>
    <button class="open-btn gal-btn" onclick="showBlock('gal')">Галерея</button>
    <button class="open-btn new-btn" onclick="showBlock('new')">Новости</button>
  </div>

  <div class="block-display" id="passwordOverlay">
    <div class="password-window">
      <label for="pass">Пароль:</label>
      <input type="password" id="pass" name="pass">
      <button type="button" onclick="checkPassword()">Продолжить</button>
    </div>
  </div>

  <!-- прием формы, отображение -->
  <div class="fullscreen-block messages-adm-wrapper active" id="msg">
    <h2>Заявки клиентов</h2>
    <table id="data-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Имя</th>
          <th>Телефон</th>
          <th>Email</th>
          <th>Категория</th>
          <th>Сообщение</th>
        </tr>
      </thead>
      <tbody>
        <!-- Данные будут вставлены сюда -->
      </tbody>
    </table>
  </div>

  <!-- блок настройки галереи -->
  <div class="fullscreen-block galer-adm-wrapper" id="gal">
    <h2>Загрузить картинку</h2>
      <form action="/upload-image" method="post" enctype="multipart/form-data">
        <p>Класс картинки:
          <select name="class" required>
            <option value="electro">Электромонтажные работы</option>
            <option value="panels">Монтаж щитков</option>
            <option value="video">Видеонаблюдение</option>
            <option value="fire">Противопожарные системы безопасности</option>
            <option value="signal">Охранные системы сигнализации</option>
          </select>
        </p>
        <p>Файл: <input type="file" name="image" accept="image/*" required></p>
        <button type="submit">Загрузить</button>
      </form>

      <h2>Галерея</h2>
        <div id="file-list">
        <p>Загружаю файлы...</p>
      </div>
  </div>

    <div class="fullscreen-block news-adm-blocb" id="new">
<!-- add-news.html -->
      <form action="/add-news" method="POST" enctype="multipart/form-data">

        <!-- Скрытое поле: класс загрузки -->
        <input type="hidden" name="class" value="news">

        <label>Заголовок:<br>
          <input type="text" name="title" required>
        </label><br><br>

        <label>Анонс:<br>
          <textarea name="preview" rows="3" required></textarea>
        </label><br><br>

        <label>Полный текст:<br>
          <textarea name="content" rows="6" required></textarea>
        </label><br><br>

        <!-- Множественная загрузка фото -->
        <label>Фото (несколько):<br>
          <input type="file" name="images" accept="image/*" multiple required>
        </label><br><br>

        <label>Дата:<br>
          <input type="date" name="date" required>
        </label><br><br>

        <button type="submit">Добавить новость</button>
      </form>

    </div>

</body>
</html>
